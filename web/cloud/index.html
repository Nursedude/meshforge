<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5"/>
  <title>MeshForge — Hawaii Mesh Live</title>
  <meta name="description" content="Live view of the LongFast Meshtastic mesh in Hawaii, captured by MeshForge NOC."/>

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
        crossorigin=""/>

  <style>
    :root {
      --bg: #0E1E2B;
      --fg: #FFFFFF;
      --muted: #A8B2BD;
      --rule: #2A3A4A;
      --accent: #E8794F;
      --good: #6FB3B8;
      --link: #6FB3B8;
      --font-stack: "IBM Plex Sans", "Inter", "Helvetica Neue", Arial, sans-serif;
      --font-mono: "IBM Plex Mono", "JetBrains Mono", "SF Mono", Consolas, monospace;
    }
    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      font-family: var(--font-stack);
      background: var(--bg);
      color: var(--fg);
      display: flex;
      flex-direction: column;
    }

    header {
      padding: 8px 16px 6px;
      border-bottom: 1px solid var(--rule);
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: baseline;
    }
    header h1 {
      margin: 0;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: -0.2px;
    }
    header .subtitle {
      color: var(--muted);
      font-size: 11px;
    }
    header .stamp {
      margin-left: auto;
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--muted);
      letter-spacing: 0.4px;
    }
    header .stamp.stale { color: var(--accent); }

    /* Info strip — one consolidated row carrying networks, space weather,
       and HF bands. Mirrors the slide-14 panel in a single tight row to
       maximize map real estate on a 13" laptop. Wraps cleanly on mobile.
       Each section is separated by an inline divider span. */
    #info {
      padding: 4px 16px;
      border-bottom: 1px solid var(--rule);
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 4px 12px;
      font-size: 11px;
      background: #0B1622;
      line-height: 1.4;
    }
    #info.hidden { display: none; }
    #info .divider {
      color: var(--rule);
      user-select: none;
    }
    .net-pill, .sw-stat {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-family: var(--font-mono);
      white-space: nowrap;
    }
    .net-pill .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      display: inline-block;
    }
    .net-pill .n { color: var(--fg); font-weight: 600; }
    .net-pill .name { color: var(--muted); font-size: 10px; }
    .net-pill.meshtastic .dot { background: #6FB3B8; }
    .net-pill.aredn      .dot { background: #E8794F; }
    .net-pill.meshcore   .dot { background: #B49AD8; }
    .net-pill.rns        .dot { background: #E8B340; }
    .sw-stat .k {
      color: var(--muted);
      font-size: 9px;
      text-transform: uppercase;
      letter-spacing: 0.4px;
    }
    .sw-stat .v { color: var(--fg); }
    .sw-bands {
      display: inline-flex;
      flex-wrap: wrap;
      gap: 3px;
      align-items: center;
    }
    .sw-band {
      font-family: var(--font-mono);
      font-size: 9px;
      padding: 1px 5px;
      border-radius: 3px;
      letter-spacing: 0.3px;
      white-space: nowrap;
    }
    .sw-band.excellent { background: #1E5F4F; color: #BCEAD4; }
    .sw-band.good      { background: #1E4A5F; color: #BCD8EA; }
    .sw-band.fair      { background: #5F4A1E; color: #EAD9BC; }
    .sw-band.poor      { background: #5F2A1E; color: #EABCBC; }
    .sw-band.unknown   { background: #2A3A4A; color: var(--muted); }
    .sw-source {
      color: var(--muted);
      font-size: 9px;
      margin-left: auto;
      font-family: var(--font-mono);
      letter-spacing: 0.3px;
    }

    #map { flex: 1; background: #0E1E2B; }

    /* Alerts banner — orange ticker above the info row when NOAA has
       active warnings/alerts in the last 72h. One line of comma-joined
       items keeps the vertical footprint minimal. */
    #alerts {
      padding: 4px 16px;
      background: #3A1F12;
      border-bottom: 1px solid #5F2A1E;
      color: #FFD7C2;
      font-size: 11px;
      display: flex;
      flex-wrap: wrap;
      gap: 4px 10px;
      align-items: center;
      line-height: 1.4;
    }
    #alerts.hidden { display: none; }
    #alerts .label {
      font-weight: 700;
      letter-spacing: 0.6px;
      text-transform: uppercase;
      font-size: 9px;
      color: var(--accent);
    }
    #alerts .alert-item {
      display: inline-flex;
      gap: 4px;
      align-items: baseline;
      font-family: var(--font-mono);
      white-space: nowrap;
    }
    #alerts .alert-item .t {
      color: var(--accent);
      font-weight: 700;
      font-size: 9px;
    }
    /* Severity colors the type chip so ALERT (observed) reads at a glance
       against WARNING (expected) / WATCH. */
    #alerts .alert-item .t.t--alert   { color: #FF6B6B; }
    #alerts .alert-item .t.t--warning { color: #FFA94D; }
    #alerts .alert-item .t.t--watch   { color: #FFD43B; }
    #alerts .alert-item .t.t--summary { color: #9AA7B2; }
    #alerts .alert-item .msg { color: #FFD7C2; }
    #alerts .sep { color: #7A4A35; user-select: none; }

    footer {
      padding: 4px 16px;
      border-top: 1px solid var(--rule);
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      font-size: 10px;
      color: var(--muted);
      letter-spacing: 0.3px;
    }
    footer a {
      color: var(--link);
      text-decoration: none;
    }
    footer a:hover { text-decoration: underline; }

    /* Leaflet popup styling — match the dark deck look */
    .leaflet-popup-content-wrapper {
      background: #16273A;
      color: var(--fg);
      border-radius: 4px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.4);
    }
    .leaflet-popup-tip { background: #16273A; }
    /* meshcore: + 64-char SHA256 hashes overflow narrow popups. Force-wrap
       all long popup tokens — same approach as meshforge-maps :8808. */
    .popup-name, .popup-id, .popup-row {
      overflow-wrap: anywhere;
      word-break: break-word;
      min-width: 0;
    }
    .popup-name { font-weight: 600; font-size: 14px; margin-bottom: 4px; }
    .popup-id   { font-family: var(--font-mono); font-size: 11px; color: var(--muted); margin-bottom: 8px; }
    .popup-row  { font-size: 12px; margin-top: 2px; }
    .popup-row .k { color: var(--muted); margin-right: 6px; }
  </style>
</head>
<body>

<header>
  <h1>MeshForge — Hawaii Mesh Live</h1>
  <span class="subtitle">LongFast nodes observed from one Big Island vantage point</span>
  <span class="stamp" id="stamp">loading…</span>
</header>

<div id="alerts" class="hidden" role="status" aria-live="polite" aria-label="Active space weather alerts">
  <span class="label">NOAA</span>
  <span id="alerts-list"></span>
</div>

<div id="info" class="hidden" aria-label="Network layer counts, space weather, HF band conditions">
  <span id="networks-list"></span>
  <span id="info-divider-1" class="divider hidden">│</span>
  <span id="sw-stats"></span>
  <span id="info-divider-2" class="divider hidden">│</span>
  <span class="sw-bands" id="sw-bands"></span>
  <span class="sw-source" id="sw-source"></span>
</div>

<div id="map" role="application" aria-label="Hawaii mesh node map"></div>

<footer>
  <span id="counts">—</span>
  <span style="margin-left:auto;">
    Open source ·
    <a href="https://github.com/Nursedude/meshforge" target="_blank" rel="noopener">github.com/Nursedude/meshforge</a>
  </span>
</footer>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
        crossorigin=""></script>
<script>
(function () {
  // SNR colour ramp matching the moc_analysis_tool theme.
  function colorForSnr(snr) {
    if (snr === null || snr === undefined) return "#5C6B7A";
    if (snr <= -10) return "#0B3C6F";
    if (snr >= 6)   return "#E8794F";
    if (snr < 0)    return "#0B3C6F";
    return "#6FB3B8";
  }
  function radiusForCount(n, max) {
    if (!max || max <= 0) return 5;
    return 4 + 12 * Math.sqrt(n / max);
  }
  function htmlEscape(s) {
    return String(s ?? "").replace(/[&<>"']/g, c =>
      ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c])
    );
  }

  // Hawaii bbox — same as REGION_PRESETS["hawaii"] in the repo.
  const map = L.map("map", { preferCanvas: true, zoomControl: true })
    .setView([20.5, -157.0], 7);

  // CartoDB Dark Matter — designed dark basemap. Allowed by CSP
  // img-src in templates/cloud/Caddyfile.j2 (re-render needed on VPS
  // when this changed: `sudo bash setup_vps.sh <domain>`).
  // If CSP blocks CartoDB (e.g. before the Caddyfile reload lands),
  // fall back to OSM with a CSS dark filter so the page never goes
  // map-less. One-shot swap on the first tile error.
  const carto = L.tileLayer("https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png", {
    subdomains: "abcd",
    maxZoom: 19,
    attribution: "© OpenStreetMap contributors © CARTO"
  });
  let fellBack = false;
  carto.on("tileerror", () => {
    if (fellBack) return;
    fellBack = true;
    map.removeLayer(carto);
    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
      maxZoom: 18,
      attribution: "© OpenStreetMap contributors"
    }).addTo(map);
    const pane = document.querySelector(".leaflet-tile-pane");
    if (pane) pane.style.filter = "hue-rotate(180deg) invert(0.92) brightness(0.95) contrast(0.88)";
  });
  carto.addTo(map);

  const layer = L.layerGroup().addTo(map);

  function refreshStamp(meta) {
    const stamp = document.getElementById("stamp");
    const counts = document.getElementById("counts");
    if (!meta || !meta.generated_at_epoch) {
      stamp.textContent = "no data yet";
      stamp.classList.add("stale");
      return;
    }
    const ageS = Math.floor(Date.now() / 1000 - meta.generated_at_epoch);
    let label;
    if (ageS < 90)        label = `updated ${ageS}s ago`;
    else if (ageS < 3600) label = `updated ${Math.floor(ageS / 60)}m ago`;
    else                  label = `updated ${Math.floor(ageS / 3600)}h ago`;
    stamp.textContent = label;
    if (ageS > 300) stamp.classList.add("stale");
    else stamp.classList.remove("stale");

    counts.textContent = `${meta.feature_count ?? 0} nodes · region ${meta.region ?? "?"}`;
    renderNetworks(meta.counts_by_network);
  }

  function renderNetworks(byNetwork) {
    const target = document.getElementById("networks-list");
    if (!byNetwork || typeof byNetwork !== "object" || !Object.keys(byNetwork).length) {
      target.innerHTML = "";
      updateInfoVisibility();
      return;
    }
    const known = ["meshtastic", "aredn", "meshcore", "rns"];
    const labels = {
      meshtastic: "Meshtastic", aredn: "AREDN", meshcore: "MeshCore", rns: "RNS",
    };
    const seen = new Set();
    const out = [];
    for (const k of known) {
      if (byNetwork[k] != null) {
        seen.add(k);
        out.push(`<span class="net-pill ${k}"><span class="dot"></span><span class="n">${byNetwork[k]}</span><span class="name">${labels[k]}</span></span>`);
      }
    }
    for (const [k, v] of Object.entries(byNetwork)) {
      if (seen.has(k)) continue;
      const name = htmlEscape(k.charAt(0).toUpperCase() + k.slice(1));
      out.push(`<span class="net-pill"><span class="dot" style="background:var(--muted)"></span><span class="n">${v}</span><span class="name">${name}</span></span>`);
    }
    target.innerHTML = out.join(" ");
    updateInfoVisibility();
  }

  function updateInfoVisibility() {
    const panel = document.getElementById("info");
    const hasNet = document.getElementById("networks-list").innerHTML.length > 0;
    const hasSw = document.getElementById("sw-stats").innerHTML.length > 0;
    const hasBands = document.getElementById("sw-bands").innerHTML.length > 0;
    if (hasNet || hasSw || hasBands) panel.classList.remove("hidden");
    else panel.classList.add("hidden");
    // Show dividers only when adjacent sections both have content
    document.getElementById("info-divider-1").classList.toggle("hidden", !(hasNet && (hasSw || hasBands)));
    document.getElementById("info-divider-2").classList.toggle("hidden", !(hasSw && hasBands));
  }

  function renderSpaceWeather(sw) {
    if (!sw) {
      document.getElementById("sw-stats").innerHTML = "";
      document.getElementById("sw-bands").innerHTML = "";
      document.getElementById("sw-source").textContent = "";
      updateInfoVisibility();
      return;
    }

    const stats = [];
    if (typeof sw.solar_flux === "number")
      stats.push(["SFI", Math.round(sw.solar_flux)]);
    if (typeof sw.k_index === "number")
      stats.push(["Kp", sw.k_index]);
    if (typeof sw.a_index === "number" && sw.a_index >= 0)
      stats.push(["A", sw.a_index]);
    if (sw.xray_flux)
      stats.push(["X-ray", sw.xray_flux]);
    if (sw.geomag_storm)
      stats.push(["Storm", sw.geomag_storm]);

    document.getElementById("sw-stats").innerHTML = stats.map(([k, v]) =>
      `<span class="sw-stat"><span class="k">${htmlEscape(k)}</span><span class="v">${htmlEscape(v)}</span></span>`
    ).join("");

    // Band conditions — order from low to high frequency to match the
    // way most propagation panels are read.
    const order = ["160m","80m","60m","40m","30m","20m","17m","15m","12m","10m","6m"];
    const bands = sw.band_conditions || {};
    const seen = new Set();
    const bandPills = [];
    for (const b of order) {
      if (b in bands) {
        seen.add(b);
        const cond = String(bands[b] || "Unknown");
        const cls = cond.toLowerCase();
        bandPills.push(`<span class="sw-band ${htmlEscape(cls)}">${htmlEscape(b)} ${htmlEscape(cond)}</span>`);
      }
    }
    // Catch any band the upstream added that we didn't list explicitly.
    for (const [b, cond] of Object.entries(bands)) {
      if (seen.has(b)) continue;
      const cls = String(cond || "Unknown").toLowerCase();
      bandPills.push(`<span class="sw-band ${htmlEscape(cls)}">${htmlEscape(b)} ${htmlEscape(cond)}</span>`);
    }
    document.getElementById("sw-bands").innerHTML = bandPills.join("");

    // Source line: e.g. "NOAA SWPC · updated 4m ago"
    let ageLabel = "";
    if (sw.generated_at_epoch) {
      const ageS = Math.floor(Date.now() / 1000 - sw.generated_at_epoch);
      if (ageS < 90)        ageLabel = `${ageS}s ago`;
      else if (ageS < 3600) ageLabel = `${Math.floor(ageS / 60)}m ago`;
      else                  ageLabel = `${Math.floor(ageS / 3600)}h ago`;
    }
    const src = sw.source || "NOAA SWPC";
    document.getElementById("sw-source").textContent =
      ageLabel ? `${src} · updated ${ageLabel}` : src;
    updateInfoVisibility();
  }

  function renderAlerts(alerts) {
    const panel = document.getElementById("alerts");
    let list = (alerts && alerts.alerts) || [];
    if (!list.length) {
      panel.classList.add("hidden");
      return;
    }
    // Belt-and-suspenders dedup: the producer already collapses NOAA's
    // re-issued products by subject, but a stale alerts.json could still
    // carry repeats — never show the same subject twice in the ticker.
    const seen = new Set();
    list = list.filter(a => {
      const k = ("" + (a.title || a.message || "")).toLowerCase();
      if (seen.has(k)) return false;
      seen.add(k); return true;
    });
    panel.classList.remove("hidden");
    // Comma-joined ticker — vertical space matters more than per-item
    // dates. Severity colors the type chip (see #alerts .t--* CSS).
    const SEV = { alert: "t--alert", warning: "t--warning", watch: "t--watch", summary: "t--summary" };
    document.getElementById("alerts-list").innerHTML = list.map(a => {
      const t = htmlEscape(a.type || "ALERT");
      const msg = htmlEscape(a.title || a.message || "");
      const sev = SEV[("" + (a.type || "ALERT")).toLowerCase()] || "t--alert";
      return `<span class="alert-item"><span class="t ${sev}">${t}</span><span class="msg">${msg}</span></span>`;
    }).join(' <span class="sep">·</span> ');
  }

  async function fetchAll() {
    try {
      const [metaResp, dataResp, swResp, alResp] = await Promise.all([
        fetch("/meta.json", { cache: "no-store" }),
        fetch("/data.geojson", { cache: "no-store" }),
        fetch("/space_weather.json", { cache: "no-store" }).catch(() => null),
        fetch("/alerts.json", { cache: "no-store" }).catch(() => null)
      ]);
      const meta = metaResp.ok ? await metaResp.json() : null;
      const data = dataResp.ok ? await dataResp.json() : null;
      const sw = (swResp && swResp.ok) ? await swResp.json().catch(() => null) : null;
      const al = (alResp && alResp.ok) ? await alResp.json().catch(() => null) : null;
      refreshStamp(meta);
      renderSpaceWeather(sw);
      renderAlerts(al);

      layer.clearLayers();
      const features = (data && data.features) || [];
      const counts = features.map(f => (f.properties && f.properties.packet_count) || 0);
      const max = counts.length ? Math.max(...counts) : 0;

      let plotted = 0;
      for (const f of features) {
        const g = f.geometry;
        const p = f.properties || {};
        if (!g || g.type !== "Point") continue;
        const [lon, lat] = g.coordinates || [];
        if (typeof lat !== "number" || typeof lon !== "number") continue;
        if (lat === 0 && lon === 0) continue;

        const snr = (typeof p.snr === "number") ? p.snr
                  : (typeof p.avg_snr === "number") ? p.avg_snr
                  : null;
        const pktCount = p.packet_count || 0;

        const marker = L.circleMarker([lat, lon], {
          radius: radiusForCount(pktCount, max),
          color: "#0E1E2B",
          weight: 1,
          fillColor: colorForSnr(snr),
          fillOpacity: 0.85,
        });
        const name = htmlEscape(p.long_name || p.name || p.short_name || "(unnamed)");
        const nodeId = htmlEscape(p.node_id || p.id || "");
        const role = htmlEscape(p.role || "");
        const hw = htmlEscape(p.hardware || p.hw_model || "");
        const snrStr = (snr === null) ? "—" : (snr >= 0 ? `+${snr.toFixed(1)}` : snr.toFixed(1)) + " dB";

        marker.bindPopup(
          `<div class="popup-name">${name}</div>` +
          `<div class="popup-id">${nodeId}</div>` +
          (role ? `<div class="popup-row"><span class="k">role</span>${role}</div>` : "") +
          (hw   ? `<div class="popup-row"><span class="k">hw</span>${hw}</div>`     : "") +
          `<div class="popup-row"><span class="k">snr</span>${snrStr}</div>` +
          (pktCount ? `<div class="popup-row"><span class="k">packets</span>${pktCount}</div>` : "")
        );
        marker.addTo(layer);
        plotted++;
      }
    } catch (err) {
      const stamp = document.getElementById("stamp");
      stamp.textContent = "fetch failed";
      stamp.classList.add("stale");
      console.error("MeshForge cloud fetch failed:", err);
    }
  }

  fetchAll();
  // Refresh every 30s — matches the cache-control header upstream.
  setInterval(fetchAll, 30 * 1000);
})();
</script>

</body>
</html>
