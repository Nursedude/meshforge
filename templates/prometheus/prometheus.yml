# MeshForge Prometheus scrape config (Phase D-4 of map-domain audit arc).
#
# Hosted on moc1 (per the locked-in arc decision: Prometheus + Grafana
# co-locate on moc1, which is also the map-domain test bed; moc2 is
# the first fleet box scraped, not the test bed).
# Add more scrape targets to the `meshforge-map` static_configs as
# additional fleet boxes get validated (operator hostname-agnostic).
#
# Scrape interval = 30s: balances freshness against the Pi-class cost
# of /metrics generation + the SD wear of repeated SQLite reads (the
# /healthz path is the hot spot and is cheap; /metrics is the more
# expensive path because it serializes the full registry).
#
# Retention: 15d default (Prometheus ships with --storage.tsdb.retention.time=15d).
# Override via /etc/default/prometheus if disk pressure becomes a concern.

global:
  scrape_interval: 30s
  evaluation_interval: 30s
  external_labels:
    monitor: meshforge-fleet
    role: noc

scrape_configs:
  # Local Prometheus self-monitoring — the standard pattern. Useful
  # for "is the scraper itself healthy" panels in Phase E Grafana.
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # MeshForge map service (:5000/metrics on each fleet box).
  # Phase D-4 starts with moc2 only — the first scrape target after
  # the local Prometheus came up; add other hosts after validating
  # they don't false-alarm during the warming window (F3 + the
  # warming-503 contract handles cold start gracefully).
  #
  # NOTE on the `fleet_role: test_bed` label: this label was set
  # under the original (wrong) framing that moc2 was the test bed.
  # The actual map-domain test bed is moc1 (the Prometheus host
  # itself; Pi 5, full stack). The label is left as-is here to
  # avoid breaking existing Grafana queries; redesign the label
  # scheme when adding fleet hosts (project_test_bed_moc1).
  - job_name: meshforge-map
    metrics_path: /metrics
    scrape_interval: 30s
    # /healthz on the map service returns 200 in BOTH warming and
    # ready states (Phase D-2). Prometheus's `up` metric becomes 1
    # as soon as the box binds :5000, even before the first collect
    # completes — distinguishing genuinely-down from cold-starting.
    static_configs:
      - targets:
          - "moc2:5000"
        labels:
          fleet_role: test_bed
          hardware: pi4b
    # When adding the rest of the fleet, follow this shape:
    #     - targets:
    #         - "<box-a>:5000"
    #         - "<box-b>:5000"
    #         - "<box-c>:5000"
    #       labels:
    #         fleet_role: production
    # Split low-resource boxes (Pi 3B / 1GB) into a separate static_config
    # if they warrant different alert thresholds — see
    # project_map_arc_findings memory for the rationale.
