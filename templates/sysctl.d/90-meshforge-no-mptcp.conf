# MeshForge: MPTCP off (2026-10-31, CVE-2026-98432).
# The fleet uses no MPTCP (0 MPTCP sockets on every box, nothing in MeshForge or
# MeshAnchor opens one); the published root exploit for this IPv4 TCP
# use-after-free needs an MPTCP listener. This removes that path only — the
# kernel fix is Raspberry Pi kernel >= 6.18.56 / 6.12.113.
# Installed by scripts/update.sh. Revert: delete this file + sysctl -w net.mptcp.enabled=1
net.mptcp.enabled = 0
