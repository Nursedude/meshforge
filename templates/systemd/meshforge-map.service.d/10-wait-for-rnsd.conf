# Drop-in for meshforge-map.service — make rnsd the RNS shared-instance host.
#
# WHY: meshforge-map runs map_data_service, which initializes RNS with
# share_instance=Yes. If it starts before rnsd has claimed the shared instance,
# map WINS the race and becomes the @rns host — but map's client config carries
# NO interfaces, so the shared instance everyone uses is loopback-only and the
# box loses all fleet RNS routing (rnsd's real uplink interface never activates
# because rnsd is relegated to a client). This caused a ~21h fleet-wide
# federator<->gateway no-route outage on 2026-05-28.
#
# FIX: order map after rnsd AND block map's start until rnsd's shared instance
# is actually up (rnstatus succeeds), so map always ATTACHES as a client instead
# of hosting. Poll up to 90s WALL-CLOCK (rnsd can take ~50s to settle + has a
# slow stop), then proceed regardless so a genuinely-down rnsd doesn't wedge the
# boot — map's :5000 still comes up, just without RNS data, and the watchdog
# flags rnsd.
#
# HANG-PROOFING (2026-05-30, project_fleet_pull_triggered_map_crashloop): when
# rnsd's RPC wedges (Issue #68), `rnstatus` does NOT return false — it HANGS.
# The old probe (bare `rnstatus` in an iteration-counted loop) then blocked
# forever, never reaching the trailing `exit 0` fail-open; systemd killed
# start-pre at the 90s TimeoutStartSec default and the unit crash-looped to dead
# (:5000 down ~25min on the federator). Two guards:
#   1. `timeout 5 rnstatus` — a hung probe returns within 5s instead of blocking.
#   2. wall-clock deadline (not iteration count) — total wait stays ~90s
#      regardless of per-probe latency; the old `i -lt 90` x (up to 5s each)
#      could balloon past 400s once probes started hanging.
# Plus TimeoutStartSec=150 so the probe budget + fail-open completes before
# systemd's start timeout kills it (they used to race at 90s; systemd won).
[Unit]
After=rnsd.service
Wants=rnsd.service

[Service]
# Bounded to ~90s wall-clock; timeout-wrap rnstatus so an Issue-#68 hang can't block.
ExecStartPre=/bin/sh -c 'end=$(($(date +%s)+90)); while [ $(date +%s) -lt $end ]; do timeout 5 /usr/local/bin/rnstatus >/dev/null 2>&1 && exit 0; sleep 2; done; exit 0'
# Must exceed the start-pre wall-clock bound so the fail-open exit 0 can fire
# instead of being killed mid-probe.
TimeoutStartSec=150
