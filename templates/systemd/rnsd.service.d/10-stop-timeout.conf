# Drop-in for rnsd.service — REQUIRED cap on the stop timeout (90s -> 15s).
#
# DO NOT RETIRE THIS FILE. rnsd's SIGTERM handler can hang on a busy transport
# node, and systemd would otherwise wait the full 90s default before SIGKILL.
# This cap makes that bounded + deterministic (~15s).
#
# WHAT THE FORK FIXED (rns 1.2.5+mf.3, 2026-05-30): RNS.Transport.detach_interfaces()
# — one place the SIGTERM main thread can block — is now bounded to RNS_DETACH_TIMEOUT
# (default 5s). That cures the detach-hang at the source.
#
# WHAT IT DID NOT FIX (proven 2026-05-30): an active proof (deliberate rnsd restart
# cycles) caught moc1 hanging the FULL 15s -> SIGKILL (result=timeout, status=9/KILL)
# WITH mf.3 loaded, and the DETACH_TIMEOUT warning never fired — so a SECOND
# shutdown-path hang exists that the detach bound does NOT cover (likely an
# uninterruptible main-thread wedge before/around the SIGTERM handler, or downstream
# in exit_handler). Only SIGKILL ends that case. THIS 15s CAP IS THE GENUINE CURE for
# it — that is why it must stay. Bounding the second path at the source is a candidate
# mf.4 (needs controlled reproduction + a live main-thread stack capture).
#
# WHY THE CAP IS SAFE: SIGKILL stops rnsd either way; RNS rebuilds its path table from
# announces within ~1 min of restart, so a fast SIGKILL loses nothing.
#
# OPERATIONAL WARNING: do NOT rapid-cycle rnsd restarts fleet-wide — each 15s-hang +
# SIGKILL plus the slow rebind opens an @rns race window for periodic RNS clients (the
# lab tracer), which can grab @rns and strand rnsd as a client (#69-adjacent). Space
# restarts out and verify rnsd owns @rns before the next box.
#
# See .claude/foundations/persistent_issues.md (fork SSOT note), project_rns_map_host_race_2026_05_28,
# project_rns_fork_shipped_2026_05_30.
[Service]
TimeoutStopSec=15s
