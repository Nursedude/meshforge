# Drop-in for rnsd.service — DEFENSE-IN-DEPTH backstop on the stop timeout.
#
# PRIMARY CURE IS NOW IN THE FORK (rns 1.2.5+mf.3, 2026-05-30): the rnsd-SIGTERM
# hang is fixed at the source. RNS.Transport.detach_interfaces() — which runs the
# graceful teardown in the SIGTERM main thread — is bounded to DETACH_TIMEOUT
# (default 5s, env RNS_DETACH_TIMEOUT): the per-interface detach `dt.join()` uses
# a deadline, and the local-client + shared-instance detach run in a daemon
# thread joined with the remaining budget. On overshoot rnsd logs and proceeds,
# so RNS.exit() reaches os._exit() *gracefully* (state IS persisted) instead of
# hanging. Canary-proven on the busy federator: a full stop completed in 0.16s
# (Result=success, exit 0 — not a SIGKILL-at-cap). See persistent_issues.md and
# the MeshForge fork's git history.
#
# WHY THIS CAP STILL EXISTS: it is a belt-and-suspenders net, NOT the cure. If the
# in-library bound ever regresses (env override dropped, future merge, a detach
# path the bound doesn't cover), this 15s cap stops a hang from reverting to
# systemd's 90s default. It is harmless while mf.3 holds (stops finish in <1s).
# RETIRE THIS DROP-IN once the mf.3 fix is soak-proven over multiple days fleet-
# wide (operator decision 2026-05-30: keep as backstop until soaked). Removal:
# delete this file + `systemctl daemon-reload` + restart rnsd, fleet-wide.
#
# HISTORY: the original 90s slow-stop made recovery restarts appear to silently
# fail (the rnsd PID stayed at boot value because the restart was still mid-stop).
# See project_rns_map_host_race_2026_05_28 and project_rns_fork_shipped_2026_05_30.
[Service]
TimeoutStopSec=15s
