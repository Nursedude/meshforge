# Drop-in for rnsd.service — cap the stop timeout (90s -> 15s).
#
# WHY: rnsd's SIGTERM handler (RNS.Reticulum.sigterm_handler ->
# Transport.detach_interfaces) runs the graceful teardown IN THE MAIN THREAD and
# HANGS on a busy transport node. detach_interfaces() does an unbounded
# `dt.join()` on per-interface detach threads (Transport.py ~L2886) plus a
# blocking shared_instance_master.detach() (the shared-instance socketserver).
# If any interface's detach() blocks (the TCP uplink socket, or the shared
# instance server still serving clients), the join never returns, os._exit() is
# never reached, and systemd waits the full default 90s before SIGKILL. This is
# upstream RNS behaviour; we do not patch installed third-party code.
#
# WHY THE CAP IS SAFE: the graceful path HANGS in detach_interfaces() *before*
# Transport.exit_handler()'s disk-save step runs, so the 90s wait persists
# nothing extra — SIGKILL is what actually stops rnsd either way. RNS rebuilds
# its path table from announces within ~1 min of restart (verified during the
# 2026-05-28 recovery), so a fast SIGKILL loses nothing. A non-busy rnsd that
# CAN shut down cleanly still does so in <5s, well within the cap.
#
# This makes restarts/recovery deterministic (~15s) instead of 90s — the 90s
# slow-stop is what made earlier recovery restarts appear to silently fail (the
# rnsd PID stayed at its boot value because the restart was still mid-stop).
# See project_rns_map_host_race_2026_05_28.
[Service]
TimeoutStopSec=15s
