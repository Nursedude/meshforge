# Drop-in for rnsd.service — opt in to the mf.5 host-loss exit-to-restart.
#
# WHAT (fork rns 1.2.5+mf.5, Issue #69): when rnsd loses the @rns bind race to
# a transient claimant (boot race / foreign daemon) it runs as a CLIENT of that
# claimant. Stock behaviour on the claimant's death is an INFINITE reconnect
# loop at the dead abstract socket — the box then has NO shared-instance host
# until a manual `systemctl restart rnsd` (struck 3/7 reboots on 2026-06-09;
# .29 sat host-less until manual remediation).
#
# WITH THIS ENV SET, a wanted-host rnsd that loses its host verifies the
# abstract socket has no listener at all (host GONE, not merely restarting —
# /proc/net/unix, unknown never treated as absence) after ~3 failed reconnects
# (~24s) and exits code 75. Restart=on-failure then brings rnsd back; the
# fresh init takes the host path cleanly, or joins as client if a real host
# appeared meanwhile. The inversion becomes self-healing; the
# rns_namespace_collision probe stays as the witness.
#
# SCOPE: rnsd unit ONLY. Never set this for embedded RNS clients (nomadnet,
# meshchat, gateway, map) — they must keep stock reconnect-forever behaviour;
# the library default is unchanged without the env.
[Service]
Environment=RNS_EXIT_ON_HOST_LOSS=1
