# Drop-in for rnsd.service — do not start until IPv6 link-local is usable.
#
# WHY: RNS AutoInterface binds IPv6 link-local multicast. Start it before the
# kernel has finished Duplicate Address Detection on a real interface and the
# bind fails with [Errno 99] EADDRNOTAVAIL:
#   [Error] Could not configure the system interface eth0 for use with
#           AutoInterface[Default Interface] ... [Errno 99]
#   [Error] An unhandled <class 'OSError'> exception occurred
# rnsd exits 255/EXCEPTION and Restart= recovers it ~5s later, so the box ends
# up healthy and the failure is easy to dismiss as noise. It is not: every
# reboot burns a failed start and a gap in RNS reachability, and the
# duty-cycle arc reboots boxes routinely.
#
# MEASURED on moc4, 2026-09-10. The asymmetry IS the diagnosis:
#   19:28 warm reboot   -> 1 rnsd failure
#   18:55 warm reboot   -> 1 rnsd failure
#   18:52 warm reboot   -> 1 rnsd failure
#   15:17 COLD power-on -> 0 failures
# A cold boot is slow enough that DAD completes first; a warm reboot is not.
#
# ⚠️ `After=network-online.target` (already on the unit) does NOT cover this.
# That target can be reached while an interface's fe80 address is still
# `tentative` — which is exactly the window the failure lives in. Ordering was
# never the missing piece; the readiness PREDICATE was.
#
# FAIL-OPEN by design. rnsd serves other interface types (TCP, RNode,
# Meshtastic), so a box with no IPv6 at all must still start it. The gate exits
# 0 after its budget and prints a witness line; behaviour is then identical to
# today. Refusing to start would be a REGRESSION against a fault that already
# self-heals.
#
# ⚠️ NO PERCENT SIGNS anywhere in ExecStartPre — a percent is a systemd unit
# specifier, expanded before the shell sees the line. That rule cost the
# federator an outage on 2026-05-30 (see meshforge-map.service.d/10-wait-for-rnsd.conf).
# The predicate lives in a SCRIPT rather than inline for the same reason: no
# nested quoting, no `$`, and it can be drilled standalone.
[Service]
ExecStartPre=/opt/meshforge/scripts/wait_for_ipv6_ll.sh 30
# Must exceed the 30s gate budget so the fail-open exit 0 fires instead of
# being killed mid-wait (the default is 90s; explicit beats inherited here).
TimeoutStartSec=120
