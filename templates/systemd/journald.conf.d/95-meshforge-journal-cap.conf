# MeshForge journal cap — install to /etc/systemd/journald.conf.d/
#
# 200M held 2.5-4.7 days on every box (measured 2026-10-12), so no weekly
# timer could ever be judged and "what happened last week" had no answer.
# 1G is ~5x that. The cap sets how much is KEPT, not how much is WRITTEN,
# so SD wear is unchanged; lowering meshtasticd's log level is the lever
# for writes. SystemKeepFree keeps its default (15% of the filesystem).
#
# Drop-ins apply in filename order and the LAST one wins. 95 sorts after both
# 200M files found on the fleet (2026-10-13): Raspberry Pi OS's
# 40-rpi-volatile-storage.conf and the hand-placed 90-meshforge-persistent.conf.
# This file was first named 90-meshforge-journal-cap.conf, which sorts BEFORE
# 90-meshforge-persistent ("j" < "p") and would have stayed at 200M on 4 boxes.
# Check the effective value: journald's own "max 1G" line after the restart.
# Apply: sudo systemctl restart systemd-journald
[Journal]
Storage=persistent
SystemMaxUse=1G
