# Drop-in for meshtasticd.service — do not start until the clock is NTP-synced.
#
# WHY (measured 2026-10-02): portduino meshtasticd decides its clock quality
# ONCE at startup, from `timedatectl status`. Started before NTP sync, it rates
# the clock RTCQualityDevice; Router.cpp then stamps every received packet
# rx_time 0 (getValidTime(RTCQualityFromNet) needs better), NodeDB never moves
# last_heard, and every node reads offline for the life of the process.
# moc4: 0 of 374 online for 5.8 days after a boot-time start (+15 s);
# moc2: 0 of 6 (+7 s). A restart after sync fixed moc4 within 4 minutes.
#
# ⚠️ `After=network-online.target` (already on most installs) does NOT cover
# this — the network is up long before NTP has stepped and disciplined the
# clock. The missing piece is the readiness PREDICATE, as with the rnsd
# IPv6-DAD gate.
#
# FAIL-OPEN by design: a box with no WAN must still get its radio. The gate
# exits 0 after its budget and prints a witness naming the consequence and the
# restart that cures it. It shrinks the race; it cannot fix an offline boot.
#
# ⚠️ NO PERCENT SIGNS in ExecStartPre — systemd unit specifier expansion (the
# 2026-05-30 federator outage). The predicate lives in a script for the same
# reason, and so it can be drilled standalone.
[Service]
# Leading '-': a MISSING script (checkout moved, perms broken) must not stop
# the radio from starting — the script itself always exits 0.
ExecStartPre=-/opt/meshforge/scripts/wait_for_ntp_sync.sh 60
# Must exceed the 60s gate budget so the fail-open exit 0 fires instead of
# being killed mid-wait (default 90s; explicit beats inherited here).
TimeoutStartSec=120
