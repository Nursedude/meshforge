# meshtasticd log filter — install to /etc/systemd/system/meshtasticd.service.d/
#
# Drops the two highest-volume meshtasticd lines before they reach the
# journal. Measured 2026-10-13 over one hour: 33-51% of meshtasticd's lines on
# the LongFast boxes are these two, and no MeshForge code reads either.
#   "Packet History - insert: Reusing slot ..."   (per relayed packet)
#   "Sort took ..."                                (node-DB sort timing)
# Everything else stays at LogLevel info: our detectors read INFO lines
# (Received text msg, Set radio, Final Tx power, Force close, Send owner, the
# MQTT root), so lowering the LogLevel to warn would blind them.
#
# Needs systemd >= 253 (LogFilterPatterns=); update.sh skips older boxes.
# Takes effect at meshtasticd's next start.
[Service]
LogFilterPatterns=~Packet History - insert
LogFilterPatterns=~Sort took
