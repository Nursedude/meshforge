# Drop-in for meshtasticd.service — keep retrying a marginal SX1262 init
# instead of latching `failed (start-limit-hit)`.
#
# WHY (2026-09-11, lehua): the unit sat `failed (start-limit-hit)` for 1h22m
# while the radio was CAPABLE of coming up. Proven, not inferred — the 05:23
# attempts logged `SX126x init result -2` (RadioLib ERR_CHIP_NOT_FOUND: a
# register readback that did not match), and an unattended retry at 05:26:13
# logged `SX126x init result 0` / `sx1262 init success` on the same boot with
# nobody touching the box. The default StartLimitBurst=5 over a 10s
# StartLimitIntervalSec burned the whole burst on a flaky init and then gave
# up PERMANENTLY. A radio that needs a few minutes of patient retries is a
# hardware annoyance; a unit that stops trying for 82 minutes is an outage we
# inflicted on ourselves.
#
# Root cause of the -2 is PHYSICAL and still open on that box (cantilevered
# HAT seated at an angle on an unsupported header; thermal expansion as the
# Pi warms is the best explanation for an unattended recovery minutes after
# boot). This drop-in does NOT fix the radio — it stops a self-healing flake
# from becoming a latched outage while the physical fault is chased.
#
# SPI-HAT boxes are the audience. Harmless on USB-radio boxes, but they have
# their own restart band-aid (meshtasticd-restart.timer, upstream VSZ leak),
# so deploy this where an SX126x init is the failure mode.
#
# ⚠️ Two properties, TWO DIFFERENT SECTIONS. StartLimitIntervalSec is a [Unit]
# property and RestartSec is a [Service] property; putting either under the
# wrong header silently no-ops and systemd reports no error. With the interval
# at 0 the rate limiter is disabled outright, which makes StartLimitBurst moot
# — the unit retries every 30s indefinitely.
#
# ⚠️ VERIFY WITH THE USec NAMES. `systemctl show -p RestartSec` and
# `-p StartLimitIntervalSec` return NOTHING on a healthy install — systemd
# exposes these as RestartUSec and StartLimitIntervalUSec. Reading that
# absence as "the drop-in did not take" (or worse, as confirmation) is the
# trap. Check:
#   systemctl show meshtasticd -p RestartUSec -p StartLimitIntervalUSec
#   -> RestartUSec=30s / StartLimitIntervalUSec=0
#   systemctl cat meshtasticd   # confirms the fragment actually merged
[Unit]
StartLimitIntervalSec=0

[Service]
RestartSec=30
