# MeshForge platform baseline — machine-readable companion to fleet_roles.yaml.
#
# GENERIC + DUPLICABLE, exactly like fleet_roles.yaml: no instance values
# (hostnames, LAN IPs, coordinates). WHICH box deviates is an instance fact and
# lives in ~/.config/meshforge/fleet_platform_declared.json, never here (MF014).
#
# WHY THIS FILE EXISTS (2026-09-11)
# ---------------------------------
# Asked "is there a meshtasticd upgrade?", answering it correctly took a
# session: read the upstream release list, notice the newest is an alpha whose
# predecessor was revoked, then read the pinned ch341 fork's SOURCE to find
# `pthread_detach` count 0 vs 1 — i.e. that "newer" would REGRESS four boxes.
# The conclusion was written to a markdown file. The next person asking pays
# again.
#
# So a pin here carries its own RE-CHECK PREDICATE: the machine-checkable
# condition under which the answer might have changed. The pin stops being a
# fact someone remembers and becomes a question something can ask.
#
# This file is DECLARATION only. Nothing here upgrades, installs, or writes —
# the TUI renders it as a surface and acting stays in scripts run knowingly.
version: 0
updated: "2026-09-11"

# ---------------------------------------------------------------------------
# Platform baseline. Tiers are a support CLAIM, not an inventory:
#   target      - what a new box gets; what CI and the fleet converge on
#   supported   - runs the product; kept deliberately, needs a declared reason
#                 per box (see the declarations file) or it reads as drift
#   deprecated  - still runs, actively being retired; a box here is drift
# A base absent from this list is UNKNOWN, never "fine".
# ---------------------------------------------------------------------------
platform:
  distro_bases:
    trixie:
      tier: target
      python: "3.13"
      note: "Debian 13 / Raspberry Pi OS trixie — the fleet's convergence target."
    bookworm:
      tier: supported
      python: "3.11"
      note: >
        Debian 12 / Raspberry Pi OS bookworm. Still the most widely deployed Pi
        OS, so it is the STANDALONE offering's real-world floor. Keeping one
        live box here is deliberate coverage CI cannot provide: CI resolves
        requirements on the oldest supported Python, but it is not a Pi with a
        radio attached. A box declared `standalone-compat` is inert, not drift.
    noble:
      tier: deprecated
      python: "3.12"
      note: >
        Ubuntu 24.04. Experiment residue, not a supported target — and it bills
        us continuously: a SECOND patched meshtasticd build (trixie links
        libgpiod.so.3, noble lacks it), a second packaging origin
        (~ppa~noble vs ~obs~beta), and a second advisory dialect. Retire by
        converging to trixie; nothing in the domain needs Ubuntu represented.

  # The lowest Python the product claims to run on. NOT the fleet's minimum —
  # the STANDALONE offering's. Raising this is a support decision, not a
  # consequence of the fleet converging (that would silently drop users).
  support_floor_python: "3.9"

# ---------------------------------------------------------------------------
# Pinned dependencies. A pin is a decision to NOT take upstream, and every one
# of them needs three things: what we hold, why, and what would change the
# answer. The third is the part that usually goes missing.
#
# recheck.kind vocabulary (closed — a consumer switches on it):
#   github_pr_merged      - repo + pr; the pin lifts if it merges
#   github_release_stable - repo; a release that is neither prerelease nor draft
#                           and is NEWER than `current` means re-evaluate
#   source_contains       - repo + ref_from + path + needle; asks the SOURCE,
#                           never the version string (the 2026-09-11 lesson)
#   manual                - no predicate exists yet; says so out loud rather
#                           than implying the pin is self-monitoring
# ---------------------------------------------------------------------------
pins:

  meshtasticd:
    mechanism: apt_hold
    current: "2.7.26.54e0d8d"
    why: >
      Upstream firmware#10468: Portduino on a USB (CH341) radio strands one 8MB
      pthread stack per interrupt cycle (~9/min, ~561 GB VSZ by day 5). Our four
      USB boxes run a patched build pinning pine64 b0694ec8, which carries the
      pthread_detach fix. Every published meshtastic build still pins
      meshtastic/libch341-spi-userspace@03bf505d, which does NOT — so "newer"
      is a REGRESSION for those boxes, not an upgrade.
    verified_at: "2026-09-11"
    blast_radius: >
      4 USB boxes regress into the VSZ leak. The apt hold is the only guard, and
      several boxes carry the OBS alpha repo at priority 500 — removing the hold
      to "unblock a roll" is how an alpha lands fleet-wide.
    recheck:
      - kind: github_pr_merged
        repo: meshtastic/libch341-spi-userspace
        pr: 2
        means: "our detach fix reached the fork meshtastic actually builds"
      - kind: source_contains
        repo: meshtastic/firmware
        ref_from: latest_stable_release
        path: variants/native/portduino.ini
        needle: "libch341-spi-userspace/archive/03bf505d"
        expect: present
        means: >
          while this pin is still 03bf505d, no published build carries the fix.
          When it CHANGES, read the new ref's libpinedio-usb.c for
          pthread_detach before believing anything.
      - kind: github_release_stable
        repo: meshtastic/firmware
        newer_than: "2.7.26.54e0d8d"
        means: "a non-prerelease newer than what we run — necessary, not sufficient"

  rns:
    mechanism: fork_pin
    current: "1.3.8+mf.0"
    why: >
      Hard fork (Nursedude/reticulum), pinned by tag AND SHA in
      requirements/rns.txt behind the MF-FORK-PIN SSOT line. Six rnsd-RPC
      fragility issues (#58/#61/#63/#68/#69/#72) collapsed into one
      meta-resolution by owning the source.
    verified_at: "2026-07-19"
    blast_radius: >
      NOT a package bump. One shared rnsd per box serves BOTH MeshForge and
      MeshAnchor, so the twins move in lockstep; a box carries up to five python
      env classes (user site, root dist-packages, pipx venvs, root user-site)
      and every one must be rolled together. Changing crypto primitives or the
      wire format forks the NETWORK, not the code — non-negotiable.
    recheck:
      - kind: manual
        means: >
          Adoption is `git merge <upstream-tag>` into our fork, then Phase-1
          parity (version marker, rnsd ownership, gateway/map/tracer, public-net
          interop proof), canary one box, soak, fleet-roll. Procedure lives in
          each fork's FORK.md. No predicate can approve this; a predicate could
          only tell us upstream moved, and stock RNS ships off-GitHub now, so we
          do not even have that. Said out loud rather than left implied.

  lxmf:
    mechanism: fork_pin
    current: "1.0.1+mf.1"
    why: "Hard fork (Nursedude/lxmf); moves in lockstep with rns."
    verified_at: "2026-07-19"
    blast_radius: "Same shared-substrate constraint as rns."
    recheck:
      - kind: manual
        means: "See rns — adopted together, never independently."
