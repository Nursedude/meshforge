# Regional RNS Server Configuration
# ===================================
# For: Primary gateway server (TCP server + LoRa egress)
#
# This configuration sets up:
# 1. TCP Server on port 4242 for client connections
# 2. RNode interface on the regional ISM band for LoRa mesh
#
# Customize before deploying:
#   - [[Regional RNS]]      → rename the section to your network
#   - [[my_rnode_gateway]]  → rename to <your_callsign>_rnode; set frequency
#   - frequency             → choose a slot for your area (see README)
#
# Copy to: ~/.reticulum/config (or /etc/reticulum/config for rnsd service)
# Then run: rnsd
#
# Generated by MeshForge — https://github.com/Nursedude/meshforge

[reticulum]
  enable_transport = True
  share_instance = True
  shared_instance_port = 37428
  instance_control_port = 37429
  panic_on_interface_errors = False

[logging]
  loglevel = 4

# Interface modes / announce rate: see the INTERFACE MODES block under
# [interfaces] in MeshForge templates/reticulum.conf before setting a mode.
[interfaces]

# TCP Server - allows remote clients to connect
# Clients use TCPClientInterface pointing to this server's IP
[[Regional RNS]]
    type = TCPServerInterface
    enabled = yes
    listen_ip = 0.0.0.0
    listen_port = 4242

# RNode LoRa Interface - connects to mesh network
# Adjust port if your RNode is on different USB port.
# Pick a frequency that matches your peers AND your regional regulations.
[[my_rnode_gateway]]
    type = RNodeInterface
    interface_enabled = True
    port = /dev/ttyACM0
    frequency = 906125000
    txpower = 22
    bandwidth = 250000
    spreadingfactor = 7
    codingrate = 5

# Optional: Add more interfaces here
# Example - second RNode on different frequency:
# [[backup_rnode]]
