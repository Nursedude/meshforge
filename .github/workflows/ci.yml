name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

# Least-privilege default for every job; the test job widens
# pull-requests for its PR-comment failure diagnostic.
permissions:
  contents: read

jobs:
  lint:
    name: Lint & Security Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: '3.11'

      - name: Run MeshForge linter
        run: python3 scripts/lint.py --all

      - name: Advisory scan for hardcoded secrets (non-blocking)
        run: |
          # Advisory only — docstring usage examples legitimately match this
          # pattern (claude_assistant.py, influxdb_exporter.py), so it cannot
          # hard-fail. Blocking secret hygiene lives in lint + review.
          HITS=$(grep -rn "password\s*=\s*['\"][^'\"]\+" src/ --include="*.py" \
            | grep -v "password\s*=\s*['\"]['\"]" | grep -v "#" | head -5 || true)
          if [ -n "$HITS" ]; then
            echo "$HITS"
            echo "::warning::Potential hardcoded passwords above — verify they are docstring examples"
          else
            echo "No potential hardcoded passwords found"
          fi

  # Branch protection REQUIRES the literal context "Syntax Check" — the
  # 2026-06-09 consolidation folded this into lint and every PR became
  # unmergeable (green checks, but the required context never reported).
  # Keep this job's name in lockstep with the protection rule.
  syntax-check:
    name: Syntax Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: '3.11'

      - name: Check Python syntax
        # compileall exits nonzero on any syntax error (the old standalone
        # syntax-check job used `find -exec py_compile \;`, which swallowed
        # per-file failures and could never fail).
        run: python -m compileall -q src

  manifest-resolve:
    # Can our requirements files actually RESOLVE on the oldest Python we
    # claim to support? Until 2026-09-11 nothing asked.
    #
    # WHY THIS EXISTS: the `test` job installs BARE PACKAGE NAMES
    # (`pip install pytest ... rich textual flask pyyaml requests psutil
    # distro`) and never reads requirements/*.txt, so pip silently resolves
    # whatever is newest-compatible for the interpreter it is on. The
    # manifests were therefore unvalidated by ANY check. Dependabot PR #1179
    # proved the hole: it went green on all six checks — 3.9 matrix leg
    # included — while proposing `requests>=2.34.2` and `pytest>=9.1.1`
    # (need >=3.10) and `websockets>=17.1` (needs >=3.11) against a package
    # that declares `requires-python = ">=3.9"`. Six green checks, and the
    # manifests could not have installed on the Python we advertise.
    #
    # --dry-run resolves the full dependency graph and fails on an
    # unsatisfiable pin WITHOUT building or installing anything, so this
    # stays seconds, not minutes. --ignore-requires-python is deliberately
    # NOT passed: the requires-python conflict IS the thing under test.
    #
    # rns.txt is excluded on purpose — it carries the MF-FORK-PIN git+SHA
    # pins, which resolve over the network from our own fork and are gated
    # by scripts/rns_version_check.py, not by pip's resolver.
    #
    # ⚠️ MIN_PY must equal pyproject.toml's requires-python floor. Two
    # consumers of one constant drift (honest_failure_modes #5), so
    # TestCIMinPythonMatchesPyproject in tests/test_honesty_invariants.py
    # fails the moment they disagree — the day 3.9 is retired, this line,
    # pyproject, the README badge and the dependabot ignores move together.
    name: Manifest resolve (oldest supported Python)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      MIN_PY: '3.9'
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Python ${{ env.MIN_PY }}
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: ${{ env.MIN_PY }}

      - name: Resolve every manifest on the oldest supported Python
        run: |
          python -m pip install --upgrade pip
          python -m pip install --dry-run --quiet \
            -r requirements/core.txt \
            -r requirements/maps.txt \
            -r requirements/mqtt.txt \
            -r requirements/monitoring.txt \
            -r requirements/dev.txt

  test:
    # Explicit name: the bare "Test Suite" auto-name appends ALL matrix
    # axes — adding the os axis renamed the context to
    # "Test Suite (3.11, ubuntu-latest)" and broke the required check
    # "Test Suite (3.11)". Pin the context to python-version only.
    name: Test Suite (${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    # 15, not 10 (raised 2026-09-01). The cap exists to kill a HANG, and a
    # hang blows past 15 as readily as 10 — but 10 sat inside the suite's
    # NORMAL range and started firing on healthy runs. 813776b8 was marked
    # `cancelled` at 18:34:31 with its own "Run tests" step already reporting
    # SUCCESS at 18:33:40: a red REQUIRED check that meant "slow", not
    # "broken" — the worst kind, because it sends the next reader hunting a
    # bug that does not exist.
    # Measured 3.9 durations that day: 8m19s, 8m47s, [cancelled], 9m04s
    # against the 10m cap; 3.11 runs ~7m30s, so 3.9 is the axis at risk. The
    # suite only grows, so the margin only shrinks.
    #
    # 30, not 15 (raised 2026-09-10). That prediction came true in ten days,
    # the SECOND false red of this exact shape: 45bd7f6d ran 3.9 for 15m15s
    # and was killed, which GitHub reports as `cancelled` -- so the required
    # check went red meaning "slow", and a reader who trusts the word goes
    # hunting for whoever cancelled it. Trend: 9m04s (09-01) -> 13m00s
    # (7f2f0d53, 09-10, with 2m of margin left) -> killed on the next commit.
    #
    # The cap is raised well CLEAR of normal runtime rather than a notch above
    # it, because of the line already written above: a hang blows past any
    # finite cap. Sizing this to "a bit more than a healthy run" therefore
    # buys nothing against the thing it guards and guarantees a false red
    # every time the suite grows -- twice now. A healthy job still ends when
    # the tests end, so the raise costs nothing on green runs; the only cost
    # is that a genuine hang burns 30 minutes instead of 15, which is bounded,
    # rare, and much cheaper than a red required check that means "slow".
    #
    # ⚠️ The RIGHT hang guard is per-test, not per-job: pytest-timeout is
    # already installed and has NO timeout configured, so today a wedged test
    # is only caught by this cap -- 15 minutes later, naming nothing. A
    # per-test timeout catches it in minutes and names THE TEST. Deliberately
    # not set here on a guessed value: too low and it fails healthy tests,
    # which is the exact failure class this commit is removing. It needs a
    # `--durations` measurement of the real tail first.
    #
    # NOT added: a suite-duration growth detector. The freeze
    # (.claude/rules/harness_restraint.md) bars new gates until 2026-10-09,
    # and a gate that watches the test suite's runtime is machinery watching
    # machinery. The number is already in front of a human twice -- this job's
    # duration in the CI UI, and honest_status's `full suite` line.
    timeout-minutes: 30  # Kill job if tests hang (measurements + rationale above)
    permissions:
      contents: read
      pull-requests: write   # for the PR-comment failure diagnostic below
    strategy:
      fail-fast: false
      matrix:
        include:
          # 3.9 = oldest fleet Python (Pi OS bullseye boxes). Pinned to
          # ubuntu-24.04 because setup-python's manifest stops carrying
          # EOL CPython builds on NEW runner images — an ubuntu-latest
          # image migration would break this leg at "Set up Python".
          # Revisit when 3.9 leaves the fleet.
          - python-version: '3.9'
            os: ubuntu-24.04
          - python-version: '3.11'
            os: ubuntu-latest

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          # Deps are installed inline below, so key the wheel cache off the
          # requirements files plus this workflow (rotates when the inline
          # list changes).
          cache-dependency-path: |
            requirements.txt
            requirements/*.txt
            .github/workflows/ci.yml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov pytest-timeout rich textual flask pyyaml requests psutil distro
          pip install meshtastic || echo "meshtastic optional - continuing"
          pip install folium || echo "folium optional - continuing"

      - name: Run tests
        id: pytest
        shell: bash
        run: |
          set -o pipefail
          # Tee full output to a file; silence chatty debug loggers at the
          # CLI boundary so the failure summary stays readable. The file is
          # surfaced by the "Dump failure summary" step below if this step
          # exits non-zero — GitHub's lazy-loaded log viewer sometimes hides
          # raw output, so we echo an explicit marker section too.
          rc=0
          python -m pytest tests/ -v --tb=short --timeout=30 --timeout-method=thread -rA \
            --ignore=tests/test_bridge_integration.py \
            -o log_cli_level=WARNING \
            2>&1 | tee /tmp/pytest.log || rc=$?
          # The raw exit code alone is a proven liar on this suite (~50% of
          # full runs exit 0 after pytest reported TESTS_FAILED — a shutdown
          # race that only loses failures toward zero). This conclusion is
          # quoted downstream as VERIFIED-tier evidence, so it goes through
          # the classifier like every other consumer; UNKNOWN fails the step.
          bash scripts/pytest_verdict.sh --log /tmp/pytest.log --rc "$rc"
        env:
          CI: true
          MESHFORGE_CI: true
          PYTHONUNBUFFERED: "1"

      - name: Dump failure summary
        if: failure() && steps.pytest.outcome == 'failure'
        shell: bash
        run: |
          # Single extraction, shared with the PR-comment step below — the
          # two steps used to grep /tmp/pytest.log independently and their
          # patterns drifted (assert|Error: head -50 vs AssertionError
          # head -30), so log dump and PR comment could disagree.
          {
            echo "--- FAILED lines ---"
            grep -aE "^FAILED|^ERROR|^tests/.*FAIL|assert|Error:|^E +" /tmp/pytest.log | head -50 || true
            echo
            echo "--- short test summary info ---"
            awk '/short test summary info/{flag=1} flag' /tmp/pytest.log | head -50 || true
          } > /tmp/failure_summary.txt
          echo "============================================"
          echo "==  PYTEST FAILURE SUMMARY (CI-EXTRACTED) =="
          echo "============================================"
          cat /tmp/failure_summary.txt
          echo "============================================"

      - name: Comment failure summary on PR
        if: failure() && steps.pytest.outcome == 'failure' && github.event_name == 'pull_request'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PY_VERSION: ${{ matrix.python-version }}
          REPO: ${{ github.repository }}
        run: |
          echo "DEBUG: entering comment step for PR #${PR_NUMBER} on ${REPO}"
          echo "DEBUG: /tmp/pytest.log size: $(wc -c </tmp/pytest.log 2>/dev/null || echo MISSING)"
          # Reuses the extraction written by "Dump failure summary" above —
          # same if-condition (minus the PR gate), so it always exists here.
          {
            echo "## CI failure summary (Python ${PY_VERSION})"
            echo
            echo '```'
            cat /tmp/failure_summary.txt
            echo '```'
          } > /tmp/comment.md
          echo "DEBUG: comment body:"
          cat /tmp/comment.md
          echo "DEBUG: posting comment…"
          gh pr comment "$PR_NUMBER" --body-file /tmp/comment.md --repo "$REPO" && echo "DEBUG: gh exit=$?" || echo "DEBUG: gh exit=$?"

  # Virtual fleet (lab.virtual_fleet, 2026-08-27): a REAL 3-node RNS fabric
  # + the REAL gateway + the REAL rt-canary, isolated by construction
  # (loopback-only TCP, vfleet-* instance names, sandbox HOME, throwaway
  # identities — inert on a public runner). smoke proves "message arrives"
  # across the fabric; chaos replays paid-for failure classes (the Lala
  # zero-byte ratchet corpse; a wedged-relay partition) asserting BOTH the
  # honest failure behavior and the recovery. This is the live-ish tier
  # between the mocked unit suite and the physical fleet — every PR gets a
  # fleet drill with no lab hardware in the loop.
  # NOT in the branch-protection required contexts yet: let it soak on main
  # first (a required job must earn required-ness; see the syntax-check
  # lesson below before ever renaming this job).
  virtual-fleet:
    name: Virtual Fleet (smoke + chaos)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: |
            requirements.txt
            requirements/*.txt

      - name: Install RNS/LXMF forks + gateway deps
        run: |
          python -m pip install --upgrade pip
          # The MF-owned forks, pinned by SHA (requirements/rns.txt is the
          # SSOT) — this job is the one CI leg that runs the REAL stack.
          pip install -r requirements/rns.txt
          pip install meshtastic rich textual flask pyyaml requests psutil distro

      - name: Smoke — message arrives across the virtual fabric
        run: |
          cd src
          python -m lab.virtual_fleet smoke --workdir "$RUNNER_TEMP/vfleet"

      - name: Chaos — fault and recovery drills
        run: |
          cd src
          python -m lab.virtual_fleet chaos --workdir "$RUNNER_TEMP/vfleet"

      - name: Teardown
        if: always()
        run: |
          cd src
          python -m lab.virtual_fleet down --workdir "$RUNNER_TEMP/vfleet" || true

      - name: Upload sandbox logs on failure
        # `failure()` is false when the job hits timeout-minutes (GitHub
        # CANCELS a timed-out job), which is the slow/hang class this job
        # exists to drill — so also fire on cancelled(). run_attempt in the
        # name avoids a 409 on "re-run failed jobs" (overwrite defaults false).
        # `warn` not `ignore`: a zero-match must leave a witness (hfm #9).
        if: failure() || cancelled()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: virtual-fleet-logs-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/vfleet/*/rnsd.log
            ${{ runner.temp }}/vfleet/*/gateway.log
            ${{ runner.temp }}/vfleet/*/echo.log
          if-no-files-found: warn
          retention-days: 7

# NOTE: the old standalone `security` job was consolidated into `lint`
# (2026-06-09): its shell=True grep was a strict subset of lint rule MF002
# and its secrets step could never fail (now an advisory step in lint).
# `syntax-check` was briefly folded in too, but branch protection requires
# the "Syntax Check" context by name, which made every PR unmergeable —
# restored as a standalone job the same day. If a required-context name
# must change, the branch protection rule changes in the SAME operation
# (repo settings → Branches), or PRs silently wedge with all-green checks.
