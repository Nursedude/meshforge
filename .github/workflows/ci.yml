name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

# Least-privilege default for every job; the test job widens
# pull-requests for its PR-comment failure diagnostic.
permissions:
  contents: read

jobs:
  lint:
    name: Lint & Security Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: '3.11'

      - name: Run MeshForge linter
        run: python3 scripts/lint.py --all

      - name: Advisory scan for hardcoded secrets (non-blocking)
        run: |
          # Advisory only — docstring usage examples legitimately match this
          # pattern (claude_assistant.py, influxdb_exporter.py), so it cannot
          # hard-fail. Blocking secret hygiene lives in lint + review.
          HITS=$(grep -rn "password\s*=\s*['\"][^'\"]\+" src/ --include="*.py" \
            | grep -v "password\s*=\s*['\"]['\"]" | grep -v "#" | head -5 || true)
          if [ -n "$HITS" ]; then
            echo "$HITS"
            echo "::warning::Potential hardcoded passwords above — verify they are docstring examples"
          else
            echo "No potential hardcoded passwords found"
          fi

  # Branch protection REQUIRES the literal context "Syntax Check" — the
  # 2026-06-09 consolidation folded this into lint and every PR became
  # unmergeable (green checks, but the required context never reported).
  # Keep this job's name in lockstep with the protection rule.
  syntax-check:
    name: Syntax Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: '3.11'

      - name: Check Python syntax
        # compileall exits nonzero on any syntax error (the old standalone
        # syntax-check job used `find -exec py_compile \;`, which swallowed
        # per-file failures and could never fail).
        run: python -m compileall -q src

  test:
    # Explicit name: the bare "Test Suite" auto-name appends ALL matrix
    # axes — adding the os axis renamed the context to
    # "Test Suite (3.11, ubuntu-latest)" and broke the required check
    # "Test Suite (3.11)". Pin the context to python-version only.
    name: Test Suite (${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10  # Kill job if tests hang
    permissions:
      contents: read
      pull-requests: write   # for the PR-comment failure diagnostic below
    strategy:
      fail-fast: false
      matrix:
        include:
          # 3.9 = oldest fleet Python (Pi OS bullseye boxes). Pinned to
          # ubuntu-24.04 because setup-python's manifest stops carrying
          # EOL CPython builds on NEW runner images — an ubuntu-latest
          # image migration would break this leg at "Set up Python".
          # Revisit when 3.9 leaves the fleet.
          - python-version: '3.9'
            os: ubuntu-24.04
          - python-version: '3.11'
            os: ubuntu-latest

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          # Deps are installed inline below, so key the wheel cache off the
          # requirements files plus this workflow (rotates when the inline
          # list changes).
          cache-dependency-path: |
            requirements.txt
            requirements/*.txt
            .github/workflows/ci.yml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov pytest-timeout rich textual flask pyyaml requests psutil distro
          pip install meshtastic || echo "meshtastic optional - continuing"
          pip install folium || echo "folium optional - continuing"

      - name: Run tests
        id: pytest
        shell: bash
        run: |
          set -o pipefail
          # Tee full output to a file; silence chatty debug loggers at the
          # CLI boundary so the failure summary stays readable. The file is
          # surfaced by the "Dump failure summary" step below if this step
          # exits non-zero — GitHub's lazy-loaded log viewer sometimes hides
          # raw output, so we echo an explicit marker section too.
          rc=0
          python -m pytest tests/ -v --tb=short --timeout=30 --timeout-method=thread -rA \
            --ignore=tests/test_bridge_integration.py \
            -o log_cli_level=WARNING \
            2>&1 | tee /tmp/pytest.log || rc=$?
          # The raw exit code alone is a proven liar on this suite (~50% of
          # full runs exit 0 after pytest reported TESTS_FAILED — a shutdown
          # race that only loses failures toward zero). This conclusion is
          # quoted downstream as VERIFIED-tier evidence, so it goes through
          # the classifier like every other consumer; UNKNOWN fails the step.
          bash scripts/pytest_verdict.sh --log /tmp/pytest.log --rc "$rc"
        env:
          CI: true
          MESHFORGE_CI: true
          PYTHONUNBUFFERED: "1"

      - name: Dump failure summary
        if: failure() && steps.pytest.outcome == 'failure'
        shell: bash
        run: |
          # Single extraction, shared with the PR-comment step below — the
          # two steps used to grep /tmp/pytest.log independently and their
          # patterns drifted (assert|Error: head -50 vs AssertionError
          # head -30), so log dump and PR comment could disagree.
          {
            echo "--- FAILED lines ---"
            grep -aE "^FAILED|^ERROR|^tests/.*FAIL|assert|Error:|^E +" /tmp/pytest.log | head -50 || true
            echo
            echo "--- short test summary info ---"
            awk '/short test summary info/{flag=1} flag' /tmp/pytest.log | head -50 || true
          } > /tmp/failure_summary.txt
          echo "============================================"
          echo "==  PYTEST FAILURE SUMMARY (CI-EXTRACTED) =="
          echo "============================================"
          cat /tmp/failure_summary.txt
          echo "============================================"

      - name: Comment failure summary on PR
        if: failure() && steps.pytest.outcome == 'failure' && github.event_name == 'pull_request'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PY_VERSION: ${{ matrix.python-version }}
          REPO: ${{ github.repository }}
        run: |
          echo "DEBUG: entering comment step for PR #${PR_NUMBER} on ${REPO}"
          echo "DEBUG: /tmp/pytest.log size: $(wc -c </tmp/pytest.log 2>/dev/null || echo MISSING)"
          # Reuses the extraction written by "Dump failure summary" above —
          # same if-condition (minus the PR gate), so it always exists here.
          {
            echo "## CI failure summary (Python ${PY_VERSION})"
            echo
            echo '```'
            cat /tmp/failure_summary.txt
            echo '```'
          } > /tmp/comment.md
          echo "DEBUG: comment body:"
          cat /tmp/comment.md
          echo "DEBUG: posting comment…"
          gh pr comment "$PR_NUMBER" --body-file /tmp/comment.md --repo "$REPO" && echo "DEBUG: gh exit=$?" || echo "DEBUG: gh exit=$?"

  # Virtual fleet (lab.virtual_fleet, 2026-08-27): a REAL 3-node RNS fabric
  # + the REAL gateway + the REAL rt-canary, isolated by construction
  # (loopback-only TCP, vfleet-* instance names, sandbox HOME, throwaway
  # identities — inert on a public runner). smoke proves "message arrives"
  # across the fabric; chaos replays paid-for failure classes (the Lala
  # zero-byte ratchet corpse; a wedged-relay partition) asserting BOTH the
  # honest failure behavior and the recovery. This is the live-ish tier
  # between the mocked unit suite and the physical fleet — every PR gets a
  # fleet drill with no lab hardware in the loop.
  # NOT in the branch-protection required contexts yet: let it soak on main
  # first (a required job must earn required-ness; see the syntax-check
  # lesson below before ever renaming this job).
  virtual-fleet:
    name: Virtual Fleet (smoke + chaos)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: |
            requirements.txt
            requirements/*.txt

      - name: Install RNS/LXMF forks + gateway deps
        run: |
          python -m pip install --upgrade pip
          # The MF-owned forks, pinned by SHA (requirements/rns.txt is the
          # SSOT) — this job is the one CI leg that runs the REAL stack.
          pip install -r requirements/rns.txt
          pip install meshtastic rich textual flask pyyaml requests psutil distro

      - name: Smoke — message arrives across the virtual fabric
        run: |
          cd src
          python -m lab.virtual_fleet smoke --workdir "$RUNNER_TEMP/vfleet"

      - name: Chaos — fault and recovery drills
        run: |
          cd src
          python -m lab.virtual_fleet chaos --workdir "$RUNNER_TEMP/vfleet"

      - name: Teardown
        if: always()
        run: |
          cd src
          python -m lab.virtual_fleet down --workdir "$RUNNER_TEMP/vfleet" || true

      - name: Upload sandbox logs on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: virtual-fleet-logs
          path: |
            ${{ runner.temp }}/vfleet/*/rnsd.log
            ${{ runner.temp }}/vfleet/*/gateway.log
            ${{ runner.temp }}/vfleet/*/echo.log
          if-no-files-found: ignore
          retention-days: 7

# NOTE: the old standalone `security` job was consolidated into `lint`
# (2026-06-09): its shell=True grep was a strict subset of lint rule MF002
# and its secrets step could never fail (now an advisory step in lint).
# `syntax-check` was briefly folded in too, but branch protection requires
# the "Syntax Check" context by name, which made every PR unmergeable —
# restored as a standalone job the same day. If a required-context name
# must change, the branch protection rule changes in the SAME operation
# (repo settings → Branches), or PRs silently wedge with all-green checks.
